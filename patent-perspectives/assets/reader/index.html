<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专利棱镜</title><style>/*READER_CSS*/</style></head><body>
<a class="skip" href="#main">跳到主要内容</a>
<header><strong>专利棱镜</strong><nav aria-label="阅读视角"><button data-role="management">管理层</button><button data-role="rd">研发</button><button data-role="ip">专利工程师</button></nav><button id="home">本视角概览</button><label>版式 <select id="layout"><option value="reading">按章阅读</option><option value="workbench">筛选工作台</option><option value="index">主题索引</option></select></label></header>
<div class="workspace"><aside><label>章节 <select id="chapter" aria-label="当前章节"></select></label><nav id="outline" aria-label="报告目录"></nav></aside>
<main id="main" tabindex="-1"><div id="identity"></div><div id="overview"></div>
<details id="filters"><summary>搜索与筛选</summary><div class="filter-grid"><label>专利号或关键词<input id="search" type="search"></label><label>产品线<select id="product"></select></label><label>目录类型<select id="kind"><option value="technical">技术申请</option><option value="design">外观设计</option></select></label><button id="reset">重置筛选</button></div><p id="filter-state"></p></details>
<section id="content" aria-live="polite"></section><nav id="pager" aria-label="章节导航"></nav></main></div>
<dialog id="evidence"><div class="dialog-top"><strong>依据与原文</strong><button id="close">关闭</button></div><div id="evidence-body"></div></dialog>
<script id="reader-data" type="application/json">/*READER_DATA*/</script><script>/*READER_JS*/</script></body></html>
